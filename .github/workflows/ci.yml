name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable   # latest patch release: security fixes land in the stdlib
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: make build
      - run: make test
      - name: Verify go.mod is tidy
        run: make tidy

  eval:
    name: Retrieval eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable   # latest patch release: security fixes land in the stdlib
          check-latest: true
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/briefd/models
          key: models-e5-small-1a55775f
      - run: make eval
