# goreleaser v2 — https://goreleaser.com
version: 2

project_name: briefd

before:
  hooks:
    - go mod tidy

builds:
  - id: briefd
    main: ./cmd/briefd
    binary: briefd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - deploy/briefd.example.yaml

checksum:
  name_template: checksums.txt

# Software bill of materials per archive (CycloneDX via syft), attached to the release.
sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Documentation
      regexp: '^docs'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore'
      - '^test'
      - '^ci'

# Homebrew: `brew install ismailperim/tap/briefd`. The cask is pushed to the
# tap repository only when HOMEBREW_TAP_TOKEN is set (contents:write on the tap).
homebrew_casks:
  - name: briefd
    repository:
      owner: ismailperim
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_TOKEN "" }}true{{ else }}false{{ end }}'
    homepage: https://github.com/ismailperim/briefd
    description: "Git-backed team knowledge, served to coding agents as token-budgeted context bundles over MCP"
    license: Apache-2.0
    commit_author:
      name: briefd-release
      email: ismailperim@gmail.com

release:
  github:
    owner: ismailperim
    name: briefd
  draft: false
  prerelease: auto
  extra_files:
    - glob: docs/assets/briefd-explainer.mp4
