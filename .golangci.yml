version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Deferred cleanup whose error cannot be acted upon.
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - (*github.com/ismailperim/briefd/internal/store.Store).Close
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers this with a curated exclude list
        - G304 # file inclusion via variable: briefd reads user-supplied paths by design
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers"]
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ismailperim/briefd
