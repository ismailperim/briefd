# Retrieval quality golden set (SPEC §8).
#
# Corpus: testdata/knowledge (fictional payments platform). Each query is
# written the way a developer or coding agent would ask while working on a
# task — not by copying the document's wording. `expected` lists the chunks
# that answer it as {path, heading}; heading matches the end of the chunk's
# breadcrumb ("Title > H2 > H3"), case-insensitively. All scopes are searched.
#
# Types: keyword (terms appear verbatim), paraphrase (meaning only),
# typo (misspelled terms), mixed-lang (Turkish or mixed Turkish/English).
#
# Do not edit expected answers to make a failing eval pass (CLAUDE.md).

queries:
  # ---------------------------------------------------------------- keyword
  - id: kw-retry-policy
    type: keyword
    query: retry policy exponential backoff attempts
    expected:
      - { path: conventions/error-handling-and-retries.md, heading: Retry policy }
  - id: kw-refund-window
    type: keyword
    query: refund window days after capture
    expected:
      - { path: domain/rules/refunds.md, heading: Refund window }
  - id: kw-idempotency-retention
    type: keyword
    query: idempotency key retention
    expected:
      - { path: domain/rules/idempotency.md, heading: Retention }
  - id: kw-payout-schedule
    type: keyword
    query: payout schedules daily weekly manual
    expected:
      - { path: domain/rules/settlement-and-payouts.md, heading: Payout schedules }
  - id: kw-chargeback-evidence-deadline
    type: keyword
    query: chargeback evidence deadline
    expected:
      - { path: domain/rules/disputes-and-chargebacks.md, heading: Evidence deadlines }
  - id: kw-webhook-signature
    type: keyword
    query: webhook HMAC signature header
    expected:
      - { path: domain/rules/webhooks-policy.md, heading: Signing }
      - { path: conventions/api-design.md, heading: Webhooks }
  - id: kw-velocity-limits
    type: keyword
    query: card velocity limits per minute
    expected:
      - { path: domain/rules/fraud-and-risk-scoring.md, heading: Velocity limits }
  - id: kw-projection-drift
    type: keyword
    query: LedgerProjectionDrift alert
    expected:
      - { path: projects/ledger-service/runbook.md, heading: Projection drift alert }
  - id: kw-kyc-tiers
    type: keyword
    query: KYC tiers volume cap
    expected:
      - { path: domain/rules/kyc-and-onboarding.md, heading: Tiers }
  - id: kw-canary-rollout
    type: keyword
    query: canary rollout 5% traffic rollback
    expected:
      - { path: conventions/infra/kubernetes.md, heading: Rollouts }
  - id: kw-fx-snapshot
    type: keyword
    query: daily FX snapshot 00:00 UTC
    expected:
      - { path: domain/decisions/0012-multi-currency.md, heading: Decision }
  - id: kw-outbox
    type: keyword
    query: transactional outbox relay
    expected:
      - { path: domain/decisions/0009-transactional-outbox.md, heading: Decision }

