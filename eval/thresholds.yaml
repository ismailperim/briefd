# CI gate for `briefd eval` (SPEC §8). The eval fails when a metric for the
# named mode drops below its threshold. Raise these as retrieval improves;
# never lower them to make a change pass without an ADR-level discussion.
#
# Baseline on 2026-09-20 (47 queries, 44 docs / 221 chunks) with the default
# multilingual-e5-small model (ADR-0006):
#   bm25   R@5 0.681  R@10 0.755  MRR 0.591
#   vector R@5 0.830  R@10 0.936  MRR 0.771
#   hybrid R@5 0.830  R@10 0.926  MRR 0.746
# all-MiniLM-L6-v2 for comparison: hybrid 0.809 / 0.936 / 0.709 (better on
# English paraphrases, much worse on Turkish queries).
# SPEC's initial target of hybrid R@5 >= 0.85 is not met yet; the gap is in
# English paraphrases (see ADR-0004 and ADR-0006 for follow-ups).
hybrid:
  recall_at_5: 0.80
  recall_at_10: 0.90
  mrr: 0.70
