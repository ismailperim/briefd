# briefd configuration. Copy to briefd.yaml (or pass --config) and adjust.
# Every key can be overridden with a BRIEFD_* environment variable, and the
# most common ones with flags: flags > env > this file > defaults.

# Address for MCP (/mcp), REST (/api) and the dashboard (/).
listen: ":7788"            # BRIEFD_LISTEN (PORT is honored too when BRIEFD_LISTEN is unset)

# SQLite database. It is a disposable cache of the knowledge source.
db: "briefd.db"            # BRIEFD_DB

# Knowledge repository: a local directory, or a git URL that briefd clones
# and keeps in sync (https://github.com/org/knowledge.git, git@host:org/repo.git).
source: "./knowledge"      # BRIEFD_SOURCE

# Bearer token required on /mcp and /api. Empty disables authentication —
# only do that on a trusted network.
api_token: ""              # BRIEFD_API_TOKEN

log_level: info            # BRIEFD_LOG_LEVEL: debug | info | warn | error

sync:
  interval: 60s            # BRIEFD_SYNC_INTERVAL; 0 = index once at startup
  webhook_secret: ""       # BRIEFD_SYNC_WEBHOOK_SECRET; enables POST /webhook/git (GitHub-style HMAC-SHA256)

git:                       # used when source is a git URL, and for proposal commits
  branch: ""               # BRIEFD_GIT_BRANCH; "" = remote default branch
  dir: ""                  # BRIEFD_GIT_DIR; default: <db dir>/knowledge-repo
  token: ""                # BRIEFD_GIT_TOKEN for https remotes (PAT with contents:read/write)
  username: ""             # BRIEFD_GIT_USERNAME; default "briefd"
  ssh_key: ""              # BRIEFD_GIT_SSH_KEY; private key path for ssh remotes ("" = ssh-agent)
  author_name: briefd      # BRIEFD_GIT_AUTHOR_NAME
  author_email: briefd@localhost   # BRIEFD_GIT_AUTHOR_EMAIL

query_log:                 # feeds GET /api/gaps and the dashboard's "Knowledge gaps" panel
  enabled: true            # BRIEFD_QUERY_LOG_ENABLED; query text is stored in the database
  retention_days: 30       # BRIEFD_QUERY_LOG_RETENTION_DAYS; pruned during sync, 0 = keep forever

forge:                     # optional: open a pull request for each proposal
  type: ""                 # BRIEFD_FORGE_TYPE: github
  token: ""                # BRIEFD_FORGE_TOKEN with pull_requests:write
  repo: ""                 # BRIEFD_FORGE_REPO owner/name; derived from source when empty
  api_url: ""              # BRIEFD_FORGE_API_URL for GitHub Enterprise

search:
  default_scopes: [domain, conventions]   # BRIEFD_DEFAULT_SCOPES (comma-separated)
  default_max_tokens: 2000                # BRIEFD_DEFAULT_MAX_TOKENS
  max_top_k: 50

metrics:
  require_auth: false      # true = GET /metrics also needs the bearer token

embeddings:
  enabled: true            # BRIEFD_EMBEDDINGS_ENABLED; false = BM25-only search
  provider: local          # BRIEFD_EMBEDDINGS_PROVIDER: local | ollama | openai | none
  # local models run in-process (pure Go); weights are downloaded once into
  # model_dir or pre-fetched with `briefd model pull`:
  #   multilingual-e5-small  100+ languages incl. Turkish, 470 MB (default)
  #   all-MiniLM-L6-v2       English only, 87 MB, ~2.5x faster
  # For ollama / openai this is the remote model name (e.g. bge-m3,
  # text-embedding-3-small).
  model: ""                # BRIEFD_EMBEDDINGS_MODEL
  model_dir: ""            # BRIEFD_EMBEDDINGS_MODEL_DIR; default: <user cache>/briefd/models/<model>
  auto_download: true      # BRIEFD_EMBEDDINGS_AUTO_DOWNLOAD
  url: ""                  # BRIEFD_EMBEDDINGS_URL, e.g. http://localhost:11434 or https://api.openai.com/v1
  api_key: ""              # BRIEFD_EMBEDDINGS_API_KEY (openai only)
  batch_size: 16           # chunks per embedding call while indexing
